<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pong — vs IA (Difficile)</title>
  <style>
    html,body{height:100%;margin:0;background:#071225}
    body{display:flex;align-items:center;justify-content:center}
    canvas{position:fixed;top:0;left:0;width:100vw;height:100vh;display:block;border:none;background:#071225}
    /* désactiver sélection */
    *{user-select:none;-webkit-user-select:none}
  </style>
</head>
<body>
  <canvas id="c"></canvas>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  // On fait en sorte que le jeu S'ADAPTE à toute la taille de l'écran
  function fit() {
    canvas.width = window.innerWidth * devicePixelRatio;
    canvas.height = window.innerHeight * devicePixelRatio;
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }
  window.addEventListener('resize', fit);
  fit();

  const paddleW = 12, paddleH = 90, ballR = 18;
  let fieldW = window.innerWidth, fieldH = window.innerHeight;

  const ballImg = new Image();
ballImg.src = 'https://upload.wikimedia.org/wikipedia/commons/3/3f/Lightning_Ball.png';

// Particles for hit effect
  const particles = [];

const state = {
    player:{x:30,y:fieldH/2 - paddleH/2},
    ai:{x:fieldW - 30 - paddleW,y:fieldH/2 - paddleH/2},
    ball:{x:fieldW/2,y:fieldH/2,vx:400*(Math.random()>0.5?1:-1),vy:300*(Math.random()>0.5?1:-1)},
    playerScore:0,aiScore:0,running:true,lastTime:null
  };

  const DIFFICULTY = 0.55;
  let mouseY = fieldH/2;

  function pointerY(e){
    return e.clientY !== undefined ? e.clientY : e.touches[0].clientY;
  }
  canvas.addEventListener('mousemove', e=> mouseY = pointerY(e));
  canvas.addEventListener('touchmove', e=>{ e.preventDefault(); mouseY = pointerY(e); }, {passive:false});

  canvas.addEventListener('click', ()=>{
    if(!state.running) spawnBall(Math.random()>0.5);
    state.running = true;
  });

  function spawnBall(dir=true){
    state.ball.x = fieldW/2;
    state.ball.y = fieldH/2;
    const speed = 450;
    state.ball.vx = (dir?1:-1)*speed;
    state.ball.vy = speed*(Math.random()*0.5 - 0.25);
  }

  function updateAI(dt){
    const target = state.ball.y - paddleH/2;
    const maxSpeed = 500;
    const dy = target - state.ai.y;
    state.ai.y += Math.sign(dy) * Math.min(Math.abs(dy), maxSpeed*dt);
    state.ai.y = Math.max(0, Math.min(fieldH - paddleH, state.ai.y));
  }

  function step(dt){
    // update particles
    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      if(p.life <= 0) particles.splice(i,1);
    }

    
    if(!state.running) return;

    state.player.y = Math.max(0, Math.min(fieldH - paddleH, mouseY - paddleH/2));

    updateAI(dt);

    state.ball.x += state.ball.vx * dt;
    state.ball.y += state.ball.vy * dt;

    if(state.ball.y - ballR < 0 || state.ball.y + ballR > fieldH)
      state.ball.vy *= -1;

    if(state.ball.x - ballR < state.player.x + paddleW){
      if(state.ball.y > state.player.y && state.ball.y < state.player.y + paddleH)
        bounce(true);
      else if(state.ball.x < 0) score(false);
    }
    if(state.ball.x + ballR > state.ai.x){
      if(state.ball.y > state.ai.y && state.ball.y < state.ai.y + paddleH)
        bounce(false);
      else if(state.ball.x > fieldW) score(true);
    }
  }

  function bounce(playerSide){
    // create blood particles
    for(let i=0;i<12;i++){
      particles.push({
        x: state.ball.x,
        y: state.ball.y,
        vx: (Math.random()*200-100),
        vy: (Math.random()*200-100),
        life: 0.4
        });
      }
    const p = playerSide ? state.player : state.ai;(playerSide)
    const p = playerSide ? state.player : state.ai;
    const impact = (state.ball.y - (p.y + paddleH/2)) / (paddleH/2);
    const speed = Math.hypot(state.ball.vx, state.ball.vy) * 1.05;
    const angle = impact * 0.7;
    state.ball.vx = (playerSide?1:-1) * Math.abs(speed * Math.cos(angle));
    state.ball.vy = speed * Math.sin(angle);
  }

  function score(playerWins){
    if(playerWins) state.playerScore++; else state.aiScore++;
    spawnBall(!playerWins);
    state.running = false;
  }

  function draw(){
    ctx.fillStyle = '#000';
    ctx.fillRect(0,0,fieldW,fieldH);

    // draw particles
    for(const p of particles){
      ctx.fillStyle = 'rgba(200,0,0,'+(p.life/0.4)+')';
      ctx.beginPath();
      ctx.arc(p.x, p.y, 5, 0, Math.PI*2);
      ctx.fill();
    }

    ctx.fillStyle = '#fff';(){
    ctx.fillStyle = '#000';
    ctx.fillRect(0,0,fieldW,fieldH);

    ctx.fillStyle = '#fff';
    fillRoundRect(state.player.x, state.player.y, paddleW, paddleH, 6);
    fillRoundRect(state.ai.x, state.ai.y, paddleW, paddleH, 6);

    ctx.beginPath();
    if(ballImg.complete){ ctx.drawImage(ballImg, state.ball.x - ballR, state.ball.y - ballR, ballR*2, ballR*2); } else { ctx.arc(state.ball.x, state.ball.y, ballR, 0, Math.PI*2); }
    ctx.fill();

    ctx.font = '40px Arial';
    ctx.textAlign='center';
    ctx.fillText(state.playerScore, fieldW/2 - 50, 60);
    ctx.fillText(state.aiScore, fieldW/2 + 50, 60);
  }

  function fillRoundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.fill();
  }

  function loop(ts){
    if(!state.lastTime) state.lastTime = ts;
    const dt = Math.min(1/30, (ts-state.lastTime)/1000);
    step(dt);
    draw();
    state.lastTime = ts;
    requestAnimationFrame(loop);
  }

  spawnBall();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
