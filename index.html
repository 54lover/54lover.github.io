<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Shoot the Image + Glitch Text</title>
  <style>
    html,body{height:100%;margin:0}
    body{overflow:hidden;background:#000;font-family:monospace;}
    canvas{position:fixed;top:0;left:0;width:100vw;height:100vh;border:none;display:block;}
    *{user-select:none;-webkit-user-select:none;}
    .fracture-container {
      position:absolute;font-size:2rem;white-space:pre;pointer-events:none;z-index:2;
    }
    .layer {
      position:absolute;top:0;left:0;pointer-events:none;
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>

<div id="container" class="fracture-container">
  <div id="main" class="layer" style="color:white;"></div>
  <div id="ghost1" class="layer" style="color:rgba(255,0,80,0.4);"></div>
  <div id="ghost2" class="layer" style="color:rgba(0,180,255,0.35);"></div>
</div>

<script>
/* --- Canvas Setup --- */
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let fieldW=window.innerWidth, fieldH=window.innerHeight;

function fit(){
    canvas.width=window.innerWidth*devicePixelRatio;
    canvas.height=window.innerHeight*devicePixelRatio;
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    fieldW=window.innerWidth;
    fieldH=window.innerHeight;
}
window.addEventListener('resize',fit);
fit();

/* --- Game Assets --- */
const ballImg=new Image();
ballImg.src='zazu.png';

/* --- Game State --- */
const state = {
    playerY: fieldH/2,
    projectiles: [],
    target: null,
    score:0
};

/* --- Input --- */
window.addEventListener('mousemove',e=>{
    state.playerY=e.clientY;
});
window.addEventListener('click',()=>{
    // Shoot projectile
    state.projectiles.push({x:50, y:state.playerY, vx:700, vy:0, radius:8});
});

/* --- Spawn Target --- */
function spawnTarget(){
    const fromLeft=Math.random()<0.5;
    const y=Math.random()*(fieldH-100)+50;
    const speed=200+Math.random()*200;
    state.target={
        x: fromLeft ? -50 : fieldW+50,
        y:y,
        vx: fromLeft ? speed : -speed,
        radius:25
    };
}
spawnTarget();

/* --- Game Loop --- */
function step(dt){
    // Move target
    if(state.target){
        state.target.x += state.target.vx * dt;
        if(state.target.x<-100 || state.target.x>fieldW+100) spawnTarget();
    }

    // Move projectiles
    for(let i=state.projectiles.length-1;i>=0;i--){
        const p=state.projectiles[i];
        p.x+=p.vx*dt;
        p.y+=p.vy*dt;

        // Check collision with target
        if(state.target){
            const dx=p.x-state.target.x;
            const dy=p.y-state.target.y;
            const dist=Math.sqrt(dx*dx+dy*dy);
            if(dist<state.target.radius+8){
                state.score++;
                state.projectiles.splice(i,1);
                spawnTarget();
                continue;
            }
        }

        // Remove offscreen projectiles
        if(p.x>fieldW) state.projectiles.splice(i,1);
    }
}

function draw(){
    ctx.fillStyle='#000';
    ctx.fillRect(0,0,fieldW,fieldH);

    // Draw player (simple gun)
    ctx.fillStyle='#0f0';
    ctx.fillRect(40,state.playerY-20,20,40);

    // Draw target
    if(state.target){
        if(ballImg.complete)
            ctx.drawImage(ballImg,state.target.x-state.target.radius,state.target.y-state.target.radius,state.target.radius*2,state.target.radius*2);
        else{
            ctx.fillStyle='red';
            ctx.beginPath();
            ctx.arc(state.target.x,state.target.y,state.target.radius,0,Math.PI*2);
            ctx.fill();
        }
    }

    // Draw projectiles
    ctx.fillStyle='yellow';
    for(const p of state.projectiles){
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);
        ctx.fill();
    }

    // Draw score
    ctx.fillStyle='#fff';
    ctx.font='40px Arial';
    ctx.fillText('Score: '+state.score, fieldW-150, 50);
}

let lastTime=null;
function loop(ts){
    if(!lastTime) lastTime=ts;
    const dt=Math.min(1/30,(ts-lastTime)/1000);
    step(dt);
    draw();
    lastTime=ts;
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* --- Glitch Text --- */
const phrases=["

    "Fais gaffe à tes meufs.",

    "7 Rue des Lions ,77400 Lagny-sur-Marne.",

    "Ton heure arrive, regarde bien la date.",
    
    "ip_adress : b51f:d68e:5b2b:b8d5:e4f9:7c07:06ad:5953",
        
    "90.121.23.167",

    "Tu crois être une bonne personne Zazu ?",

    "Tu vas très bientôt avoir ton downfall.",

    "Tu es un pédophile ZAZU.",

    "31 ans et 16 ans ce n'est pas NORMAL.",

    "J'ai des dossiers importants sur toi.",

    "Regarde bien partout quand tu sors."];
const container=document.getElementById("container");
const main=document.getElementById("main");
const ghost1=document.getElementById("ghost1");
const ghost2=document.getElementById("ghost2");
let currentPhrase="",typedChars=[];

function getRandomPhrase(){let phrase;do{phrase=phrases[Math.floor(Math.random()*phrases.length)];}while(phrase===currentPhrase&&phrases.length>1);currentPhrase=phrase;return phrase;}
function rand(n){return Math.random()*n-n/2;}
function chaos(c){if(c===" ") return" "; if(Math.random()<0.1){const pool="!@#$%^&*()<>?/\\[]{}+=-_~";c=pool[Math.floor(Math.random()*pool.length)];} return c;}
function randomPosition(){const w=window.innerWidth,h=window.innerHeight;const rw=750;const lw=0; const x=lw+Math.random()*Math.max(0,w-rw-lw); const y=Math.random()*Math.max(0,h-50); container.style.left=x+'px'; container.style.top=y+'px';}
function typePhrase(chars,i=0){if(i<chars.length){typedChars.push(chars[i]);setTimeout(()=>typePhrase(chars,i+1),10+Math.random()*10);}}
function render(){if(typedChars.length>0){let mainOut="",ghostOut="",ghostOut2="";for(let c of typedChars){const g=chaos(c); mainOut+=`<span style="display:inline-block;transform:translate(${rand(2)}px,${rand(2)}deg) skew(${rand(5)}deg);opacity:${0.2+Math.random()*0.5};">${g}</span>`; ghostOut+=`<span style="display:inline-block;transform:translate(${rand(10)}px,${rand(5)}deg) skew(${rand(10)}deg);opacity:${0.05+Math.random()*0.3};">${g}</span>`; ghostOut2+=`<span style="display:inline-block;transform:translate(${rand(5)}px,${rand(10)}px) scale(${1+Math.random()*0.3});opacity:${0.05+Math.random()*0.25};">${g}</span>`;} main.innerHTML=mainOut; ghost1.innerHTML=ghostOut; ghost2.innerHTML=ghostOut2; container.style.transform=`translate(${rand(5)}px,${rand(5)}px) rotate(${rand(1)}deg)`;} requestAnimationFrame(render);}
function showNewPhrase(){typedChars=[];const phrase=getRandomPhrase();const chars=phrase.split("");randomPosition();typePhrase(chars);}
showNewPhrase(); render(); setInterval(showNewPhrase,1000+Math.random()*500);
</script>
</body>
</html>
