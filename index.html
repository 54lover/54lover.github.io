<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Peak 54</title>
<style>
html,body{
  margin:0;padding:0;height:100%;overflow:hidden;
  background:#000;font-family:"Poppins",sans-serif;
}
#bg{
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:0;
  pointer-events:none; /* ignore clicks so buttons work */
}
main{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  z-index:2;
}

/* === Tempered glass title === */
.glass-title{
  font-size:9rem;
  font-weight:800;
  text-transform:uppercase;
  color:transparent;
  background:linear-gradient(135deg,rgba(255,255,255,.85),rgba(255,255,255,.15));
  background-clip:text;-webkit-background-clip:text;
  -webkit-text-stroke:2px rgba(255,255,255,.3);
  mix-blend-mode:lighten;
  backdrop-filter:blur(6px)saturate(160%);
  -webkit-backdrop-filter:blur(6px)saturate(160%);
  opacity:.99;
  letter-spacing:4px;
  text-shadow:0 1px 2px rgba(255,255,255,.4),0 6px 16px rgba(0,0,0,.25);
}
.hint{
  margin-top:2rem;
  font-size:.9rem;
  color:rgba(255,255,255,.6);
}

/* === Spotify-style glass player === */

.track-info{display:flex;flex-direction:column;}
.track-title{font-weight:600;font-size:.9rem;}
.track-artist{font-size:.75rem;opacity:.7;}
.play-btn {
  background: none;
  border: none;
  color: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;

  width: 3.5rem;  /* keeps layout stable */
  height: 3.5rem;
  transition: transform 0.2s ease, opacity 0.2s ease;
}

.play-btn:hover {
  transform: scale(1.1);
  opacity: 0.9;
}

/* Large SVG icons */
.play-btn svg {
  width: 48px;   /* adjust this size to your liking */
  height: 48px;
  pointer-events: none;
}


.progress-container{
  display:flex;align-items:center;gap:.5rem;width:400px;max-width:50vw;
}
.time{font-size:.7rem;opacity:.8;width:32px;text-align:center;}
.progress{
  flex:1;height:4px;background:rgba(255,255,255,.2);
  border-radius:2px;cursor:pointer;position:relative;
}
.progress-bar{
  height:100%;width:0%;
  background:linear-gradient(90deg,rgba(255,255,255,.9),rgba(255,255,255,.3));
  border-radius:2px;
}
.volume{
  width:100px;appearance:none;height:4px;
  background:rgba(255,255,255,.2);border-radius:4px;cursor:pointer;
}
.volume::-webkit-slider-thumb{
  appearance:none;width:12px;height:12px;border-radius:50%;
  background:rgba(255,255,255,.9);
  box-shadow:0 0 10px rgba(255,255,255,.4);
}
.player {
  position: absolute;
  top: calc(50% + 8rem); /* places it just below the title */
  left: 50%;
  transform: translateX(-50%);
  width: min(90%, 700px);

  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 1.25rem;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1rem 1.75rem;
  box-sizing: border-box;
  z-index: 5;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.player:hover {
  transform: translateX(-50%) translateY(-4px);
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
}

.left, .center, .right {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

</style>
</head>
<body>

<video id="bg" autoplay muted loop playsinline>
  <source src="bg.mp4" type="video/mp4">
</video>

<main>
  <h1 class="glass-title">Peak 54</h1>
</main>

<div class="player">
  <div class="left">
<button class="play-btn" id="playPause" aria-label="Play/Pause">
  <svg id="playIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white">
    <path d="M8 5v14l11-7z"/>
  </svg>
  <svg id="pauseIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" style="display:none;">
    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
  </svg>
</button>


    <div class="track-info">
      <div class="track-title">B.O.R (Birth Of Rap)</div>
      <div class="track-artist">Lil B</div>
    </div>
  </div>

  <div class="center">
    <div class="progress-container">
      <span class="time" id="currentTime">0:00</span>
      <div class="progress" id="progress">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <span class="time" id="duration">0:00</span>
    </div>
  </div>

  <div class="right">
    <input type="range" id="volume" class="volume" min="0" max="1" step="0.01" value="0.7">
  </div>
</div>

<audio id="bgSound" src="sound.mp3" preload="auto"></audio>

<script>
const sound = document.getElementById("bgSound");
const playBtn = document.getElementById("playPause");
const playIcon = document.getElementById("playIcon");
const pauseIcon = document.getElementById("pauseIcon");
const progress = document.getElementById("progress");
const progressBar = document.getElementById("progressBar");
const currentTimeEl = document.getElementById("currentTime");
const durationEl = document.getElementById("duration");
const volume = document.getElementById("volume");
let isPlaying = false;

function formatTime(sec) {
  if (isNaN(sec)) return "0:00";
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60).toString().padStart(2, "0");
  return `${m}:${s}`;
}

// === Handle body click for autoplay (browser requirement) ===
document.body.addEventListener(
  "click",
  async () => {
    if (!isPlaying) {
      try {
        await sound.play();
        isPlaying = true;
        playIcon.style.display = "none";
        pauseIcon.style.display = "block";
      } catch (e) {
        console.log(e);
      }
    }
  },
  { once: true }
);

// === Toggle Play/Pause button ===
playBtn.addEventListener("click", async (e) => {
  e.stopPropagation(); // prevents retriggering the body click listener
  if (isPlaying) {
    sound.pause();
    playIcon.style.display = "block";
    pauseIcon.style.display = "none";
  } else {
    try {
      await sound.play();
      playIcon.style.display = "none";
      pauseIcon.style.display = "block";
    } catch (err) {
      console.error("Playback failed:", err);
    }
  }
  isPlaying = !isPlaying;
});

// === Update duration when metadata loads ===
sound.addEventListener("loadedmetadata", () => {
  durationEl.textContent = formatTime(sound.duration);
});

// === Update progress bar as track plays ===
sound.addEventListener("timeupdate", () => {
  if (sound.duration) {
    const progressPercent = (sound.currentTime / sound.duration) * 100;
    progressBar.style.width = progressPercent + "%";
    currentTimeEl.textContent = formatTime(sound.currentTime);
  }
});

// === Seek when clicking the progress bar ===
progress.addEventListener("click", (e) => {
  const rect = progress.getBoundingClientRect();
  const pos = (e.clientX - rect.left) / rect.width;
  sound.currentTime = pos * sound.duration;
});

// === Volume control ===
volume.addEventListener("input", () => {
  sound.volume = volume.value;
});

// === Reset icons when track ends ===
sound.addEventListener("ended", () => {
  isPlaying = false;
  playIcon.style.display = "block";
  pauseIcon.style.display = "none";
});
</script>
</body>
</html>
