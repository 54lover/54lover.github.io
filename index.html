    html,body{height:100%;margin:0}

    *{user-select:none;-webkit-user-select:none}
  </style>
</head>
<body>
  <canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  function fit() {
    canvas.width = window.innerWidth * devicePixelRatio;
    canvas.height = window.innerHeight * devicePixelRatio;
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }
  window.addEventListener('resize', fit);
  fit();

  const paddleW = 12, paddleH = 90, ballR = 18;
  const paddleW = 12, paddleH = 90, ballR = 40;
  let fieldW = window.innerWidth, fieldH = window.innerHeight;

  const ballImg = new Image();
  ballImg.src = 'zazu.png';

  const bgImg = new Image();
  bgImg.src = 'bg.png'; // your background file


  const particles = [];

  const state = {
    player:{x:30,y:fieldH/2 - paddleH/2},
    ai:{x:fieldW - 30 - paddleW,y:fieldH/2 - paddleH/2},
    ball:{x:fieldW/2,y:fieldH/2,vx:400*(Math.random()>0.5?1:-1),vy:300*(Math.random()>0.5?1:-1)},
    playerScore:0,aiScore:0,running:true,lastTime:null
  };

  const DIFFICULTY = 0.55;
  let mouseY = fieldH/2;

  function pointerY(e){return e.clientY !== undefined ? e.clientY : e.touches[0].clientY;}
  canvas.addEventListener('mousemove', e=> mouseY = pointerY(e));
  canvas.addEventListener('touchmove', e=>{ e.preventDefault(); mouseY = pointerY(e); }, {passive:false});
    const dt = Math.min(1/30, (ts-state.lastTime)/1000);
    step(dt);
    draw();
    state.lastTime = ts;
    requestAnimationFrame(loop);
  }

  spawnBall();
  requestAnimationFrame(loop);
})();
</script>
</body>
