<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title> Ta Fin Est Proche, Zazu. </title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      cursor: crosshair;
      background: #000 url('bg.png') no-repeat center center/cover;
      font-family: monospace;
    }

    /* Title styles */
    #title {
      position: absolute;
      top: 20px; /* distance from top */
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-family: 'Bebas Neue', cursive;
      font-size: 4rem;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
      pointer-events: none;
      z-index: 1000;
      letter-spacing: 2px;
    }

    #gameArea {
      width: 100%;
      height: 100%;
      position: relative;
    }
    .fracture-container {
      position: absolute;
      font-size: 2rem;
      white-space: pre;
      pointer-events: none;
      z-index: 999
    }
    .blood {
      position: absolute;
      width: 200px;
      height: 200px;
      background: url('blood.png') no-repeat center center/contain;
      pointer-events: none;
    }


    .layer {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="title">C'est Un Avertissement, Pour Toi, Zazu.</div>
<div id="gameArea">
    <div id="container" class="fracture-container">
        <div id="main" class="layer" style="color:white;"></div>
        <div id="ghost1" class="layer" style="color:rgba(255,0,80,0.4);"></div>
        <div id="ghost2" class="layer" style="color:rgba(0,180,255,0.35);"></div>
    </div>
</div>

<audio id="gunshot" src="gunshot.mp3"></audio>
<audio id="bgm" src="MeetTheZazu.mp3" loop></audio>
<script src="Phrase.js"></script> <!-- Your phrases array -->

<script>
const gameArea = document.getElementById('gameArea');
const gunshot = document.getElementById('gunshot');
const bgm = document.getElementById("bgm");

  // Autoplay sera bloqué tant que l'utilisateur n'a pas interagi
function startMusic() {
  bgm.volume = 0.5; // volume confortable
  bgm.play().catch(()=>{});
  window.removeEventListener('click', startMusic);
  window.removeEventListener('touchstart', startMusic);
}

  // Premier clic → on lance la musique
window.addEventListener('click', startMusic);
window.addEventListener('touchstart', startMusic);

// Define the target rectangle as percentages of the background image
// x, y = top-left corner, width, height
const targetRectPercent = { x: 0.2, y: 0.2, width: 0.5, height: 0.7 }; // 40% from left, 20% from top, 50% width, 50% height

gameArea.addEventListener('click', (e) => {
    const rect = gameArea.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    // Calculate rectangle in pixels based on current gameArea size
    const targetRectPx = {
        x: targetRectPercent.x * rect.width,
        y: targetRectPercent.y * rect.height,
        width: targetRectPercent.width * rect.width,
        height: targetRectPercent.height * rect.height
    };

    if (x >= targetRectPx.x && x <= targetRectPx.x + targetRectPx.width &&
        y >= targetRectPx.y && y <= targetRectPx.y + targetRectPx.height) {

        gunshot.currentTime = 0;
        gunshot.volume = 0.1;
        gunshot.play();

        const blood = document.createElement('div');
        blood.className = 'blood';
        blood.style.left = (x - 100) + 'px'; // center
        blood.style.top = (y - 200) + 'px';
        gameArea.appendChild(blood);
    }
});

// --- Glitch text logic ---
const container = document.getElementById("container");
const main = document.getElementById("main");
const ghost1 = document.getElementById("ghost1");
const ghost2 = document.getElementById("ghost2");

let currentPhrase = "";
let typedChars = [];

function getRandomPhrase() {
    let phrase;
    do {
        phrase = phrases[Math.floor(Math.random() * phrases.length)];
    } while (phrase === currentPhrase && phrases.length > 1);
    currentPhrase = phrase;
    return phrase;
}

function rand(n){return Math.random()*n - n/2;}
function chaos(c) {
    if(c===" ") return " ";
    if(Math.random()<0.1){
        const pool = "!@#$%^&*()<>?/\\[]{}+=-_~";
        c = pool[Math.floor(Math.random()*pool.length)];
    }
    return c;
}

function randomPosition() {
    const containerWidth = container.offsetWidth;
    const containerHeight = container.offsetHeight;
    const maxX = window.innerWidth - containerWidth - 50;
    const x = Math.random() * Math.max(0, maxX);
    const maxY = window.innerHeight - containerHeight;
    const y = Math.random() * Math.max(0, maxY);
    container.style.left = `${x}px`;
    container.style.top = `${y}px`;
}

function typePhrase(chars, index=0){
    if(index<chars.length){
        typedChars.push(chars[index]);
        setTimeout(()=>typePhrase(chars,index+1),10 + Math.random()*10);
    }
}

function render(){
    if(typedChars.length>0){
        let mainOut="",ghostOut="",ghostOut2="";
        for(let c of typedChars){
            const glitched = chaos(c);
            mainOut += `<span style="display:inline-block; transform:translate(${rand(2)}px,${rand(2)}px) skew(${rand(5)}deg); opacity:${0.2+Math.random()*1};">${glitched}</span>`;
            ghostOut += `<span style="display:inline-block; transform:translate(${rand(10)}px,${rand(5)}px) skew(${rand(10)}deg); opacity:${0.05+Math.random()*1};">${glitched}</span>`;
            ghostOut2 += `<span style="display:inline-block; transform:translate(${rand(5)}px,${rand(10)}px) scale(${1+Math.random()*0.3}); opacity:${0.05+Math.random()*1};">${glitched}</span>`;
        }
        main.innerHTML=mainOut;
        ghost1.innerHTML=ghostOut;
        ghost2.innerHTML=ghostOut2;
        container.style.transform = `translate(${rand(5)}px,${rand(5)}px) rotate(${rand(1)}deg)`;
    }
    requestAnimationFrame(render);
}

function showNewPhrase(){
    typedChars = [];
    const phrase = getRandomPhrase();
    const chars = phrase.split("");
    randomPosition();
    typePhrase(chars);
}

showNewPhrase();
render();
setInterval(showNewPhrase, 1000 + Math.random()*500);
</script>
</body>
</html>
