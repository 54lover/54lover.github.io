<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pong — vs IA (Difficile)</title>
  <style>
    html,body{height:100%;margin:0;background:#071225}
    body{display:flex;align-items:center;justify-content:center}
    canvas{position:fixed;top:0;left:0;width:100vw;height:100vh;display:block;border:none;background:#071225}
    /* désactiver sélection */
    *{user-select:none;-webkit-user-select:none}
  </style>
</head>
<body>
  <canvas id="c"></canvas>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const VIRTUAL_W = 800, VIRTUAL_H = 450;

  function fit(){
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * devicePixelRatio;
    canvas.height = rect.height * devicePixelRatio;
    ctx.setTransform(devicePixelRatio * (VIRTUAL_W / rect.width), 0, 0, devicePixelRatio * (VIRTUAL_H / rect.height), 0, 0);
  }
  window.addEventListener('resize', fit);
  fit();

  const paddleW = 12, paddleH = 90, ballR = 7;
  const state = {
    player:{x:30,y:VIRTUAL_H/2 - paddleH/2},
    ai:{x:VIRTUAL_W - 30 - paddleW,y:VIRTUAL_H/2 - paddleH/2},
    ball:{x:VIRTUAL_W/2,y:VIRTUAL_H/2,vx:240*(Math.random()>0.5?1:-1),vy:140*(Math.random()>0.5?1:-1)},
    playerScore:0,aiScore:0,running:true,lastTime:null
  };

  // DIFFICULTÉ: difficile (IA très réactive)
  const DIFFICULTY = 0.55; // plus petit => IA plus réactive in updateAI

  // souris/tactile
  let mouseY = VIRTUAL_H/2;
  function pointerY(e){
    const rect = canvas.getBoundingClientRect();
    const clientY = e.clientY !== undefined ? e.clientY : (e.touches ? e.touches[0].clientY : 0);
    return (clientY - rect.top) * (VIRTUAL_H / rect.height);
  }
  canvas.addEventListener('mousemove', e=>{ mouseY = pointerY(e); });
  canvas.addEventListener('touchmove', e=>{ e.preventDefault(); mouseY = pointerY(e); }, {passive:false});

  // clic pour relancer la balle si arrêt
  canvas.addEventListener('click', ()=>{ if(!state.running) spawnBall(Math.random()>0.5); state.running = true; });

  function spawnBall(toRight=true){
    state.ball.x = VIRTUAL_W/2; state.ball.y = VIRTUAL_H/2;
    const speed = 260; const angle = (Math.random()*0.6-0.3);
    state.ball.vx = (toRight?1:-1)*speed; state.ball.vy = speed*angle;
  }

  function updateAI(dt){
    // IA difficile: très rapide mais toujours imparfaite
    const target = state.ball.y - paddleH/2;
    const maxSpeed = 320 * (1.2 - DIFFICULTY); // DIFFICULTY=0.55 -> grande vitesse
    const dy = target - state.ai.y;
    if(Math.abs(dy) > 1){ state.ai.y += Math.sign(dy) * Math.min(Math.abs(dy), maxSpeed*dt); }
    state.ai.y = Math.max(0,Math.min(VIRTUAL_H - paddleH, state.ai.y));
  }

  function step(dt){
    if(!state.running) return;
    // joueur suit la souris (lissage léger)
    const targetPlayer = mouseY - paddleH/2;
    state.player.y += (targetPlayer - state.player.y) * Math.min(1, 18 * dt);
    state.player.y = Math.max(0, Math.min(VIRTUAL_H - paddleH, state.player.y));

    updateAI(dt);

    state.ball.x += state.ball.vx * dt;
    state.ball.y += state.ball.vy * dt;

    // rebonds haut/bas
    if(state.ball.y - ballR < 0){ state.ball.y = ballR; state.ball.vy *= -1; }
    if(state.ball.y + ballR > VIRTUAL_H){ state.ball.y = VIRTUAL_H - ballR; state.ball.vy *= -1; }

    // collision joueur
    if(state.ball.x - ballR < state.player.x + paddleW){
      if(state.ball.y > state.player.y && state.ball.y < state.player.y + paddleH){
        state.ball.x = state.player.x + paddleW + ballR;
        const impact = (state.ball.y - (state.player.y + paddleH/2)) / (paddleH/2);
        const speed = Math.hypot(state.ball.vx, state.ball.vy) * 1.06;
        const angle = impact * 0.9;
        state.ball.vx = Math.abs(speed * Math.cos(angle));
        state.ball.vy = speed * Math.sin(angle);
      } else if(state.ball.x < 0){ state.aiScore++; spawnBall(true); state.running = false; }
    }

    // collision IA
    if(state.ball.x + ballR > state.ai.x){
      if(state.ball.y > state.ai.y && state.ball.y < state.ai.y + paddleH){
        state.ball.x = state.ai.x - ballR;
        const impact = (state.ball.y - (state.ai.y + paddleH/2)) / (paddleH/2);
        const speed = Math.hypot(state.ball.vx, state.ball.vy) * 1.06;
        const angle = impact * 0.9;
        state.ball.vx = -Math.abs(speed * Math.cos(angle));
        state.ball.vy = speed * Math.sin(angle);
      } else if(state.ball.x > VIRTUAL_W){ state.playerScore++; spawnBall(false); state.running = false; }
    }
  }

  function draw(){
    ctx.clearRect(0,0,VIRTUAL_W,VIRTUAL_H);
    ctx.fillStyle = '#071225'; ctx.fillRect(0,0,VIRTUAL_W,VIRTUAL_H);

    // filet
    ctx.fillStyle = 'rgba(255,255,255,0.06)'; const gap=14, w=4;
    for(let y=10;y<VIRTUAL_H;y+=gap) ctx.fillRect(VIRTUAL_W/2 - w/2, y, w, gap/2);

    // paddles
    ctx.fillStyle = '#fff'; roundRect(state.player.x, state.player.y, paddleW, paddleH, 6);
    roundRect(state.ai.x, state.ai.y, paddleW, paddleH, 6);

    // balle
    ctx.beginPath(); ctx.arc(state.ball.x, state.ball.y, ballR, 0, Math.PI*2); ctx.fill();

    // scores
    ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.font = '20px system-ui'; ctx.textAlign='center';
    ctx.fillText(state.playerScore, VIRTUAL_W/2 - 40, 36); ctx.fillText(state.aiScore, VIRTUAL_W/2 + 40, 36);
  }

  function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); ctx.fill(); }

  function loop(ts){ if(!state.lastTime) state.lastTime = ts; const dt = Math.min(1/30, (ts - state.lastTime)/1000); step(dt); draw(); state.lastTime = ts; requestAnimationFrame(loop); }

  // démarrage automatique
  spawnBall(Math.random()>0.5);
  state.running = true;
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
